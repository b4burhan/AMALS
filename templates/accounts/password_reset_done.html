{% extends 'base.html' %}
{% load static %}

{% block title %}Email Sent{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-envelope-check display-1 text-success"></i>
                        <h2 class="mt-3 fw-bold">Check Your Email</h2>
                        <p class="text-muted">We've sent you an email with instructions to reset your password. Please check your inbox.</p>
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
