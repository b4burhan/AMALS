{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-check-circle-fill display-1 text-success"></i>
                        <h2 class="mt-3 fw-bold">Password Reset Complete</h2>
                        <p class="text-muted">Your password has been set successfully. You can now log in with your new password.</p>
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
