{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <i class="bi bi-exclamation-circle display-1 text-muted"></i>
                <h1 class="display-1 fw-bold mt-3">404</h1>
                <h2 class="mb-3">Page Not Found</h2>
                <p class="lead text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-house me-2"></i>Go Home
                    </a>
                    <a href="{% url 'shop:product_list' %}" class="btn btn-outline-primary btn-lg">
                        <i class="bi bi-shop me-2"></i>Shop Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
