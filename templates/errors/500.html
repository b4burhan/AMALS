{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                <h1 class="display-1 fw-bold mt-3">500</h1>
                <h2 class="mb-3">Server Error</h2>
                <p class="lead text-muted mb-4">Something went wrong on our end. Please try again later.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-house me-2"></i>Go Home
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-primary btn-lg">
                        <i class="bi bi-arrow-clockwise me-2"></i>Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
